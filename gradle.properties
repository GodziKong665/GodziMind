# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# El sandbox de Windows no puede abrir el hilo del watcher nativo (error 5).
org.gradle.vfs.watch=false

# Kotlin: compilar dentro del proceso de Gradle. El daemon de Kotlin no puede
# abrir hilos nativos en este entorno y el fallback tardaba más.
kotlin.compiler.execution.strategy=in-process

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
